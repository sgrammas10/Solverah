# priors.yaml  --  EXPERT-ELICITED weights (adopted 2026-09-17).
#
# Source: Julie's returned priors_elicitation_v1 form (solverah_priors_julie.json, saved
# 2026-09-17), converted by Solverah_IP/priors_elicitation/convert_priors_response.py.
# The numbers below are that converter's output, unedited. The placeholder values this
# file carried before are kept in priors_placeholder.yaml -- the diff between the two IS
# the expert's contribution.
#
# These are one domain expert's judgement converted to logit-scale weights, NOT a
# measurement. Every `mean` traces to an answer of the form "out of ten people like
# this, how many are still doing well a year later", asked at a pole-vs-pole mismatch
# (|gap| = 0.8). Every `sd` traces to her stated confidence ("confident" on all six),
# through the mapping named at the top of the converter -- the one judgement call in
# the pipeline. The form's consistency re-ask is VOID (its reworded vignette changed a
# need into a tolerance), so NO noise-floor read sits under these numbers, in either
# direction. They stop being guesses only when a fit has outcome data to pull them.
#
# Convention (logistic linear predictor):
#   logit(P_fit) = intercept
#                + sum over active dims:  mag*|gap| + dir*gap
#                + sum over active+measurable confounders:  weight * standardized_value
#
#   mean -> the expert's best guess
#   sd   -> how sure the expert is. Small sd = confident, large sd = "not sure, let the
#           data decide."
#
# Baseline: a well-matched person was put at 8 in 10 -> intercept 1.386294
#
#   mag < 0 : a mismatch on this dimension lowers the odds
#   dir > 0 : wanting MORE than the role offers is the cheaper direction to be wrong in
#   dir < 0 : wanting LESS than the role offers is the cheaper direction
#
# Her answers (person-high/role-low, person-low/role-high), out of 10:
#   autonomy 7/7   pace 3/4   collaboration 7/6   feedback 7/3   innovation 5/5   decision 8/5

intercept: { mean: 1.386294, sd: 1.000000 }

dimensions:
  autonomy:      { mag: {mean: -0.673746, sd: 0.309359}, dir: {mean: 0.000000, sd: 0.309359} }
  pace:          { mag: {mean: -2.515845, sd: 0.309359}, dir: {mean: -0.276145, sd: 0.309359} }
  collaboration: { mag: {mean: -0.949891, sd: 0.309359}, dir: {mean: 0.276145, sd: 0.309359} }
  feedback:      { mag: {mean: -1.732868, sd: 0.309359}, dir: {mean: 1.059122, sd: 0.309359} }
  innovation:    { mag: {mean: -1.732868, sd: 0.309359}, dir: {mean: 0.000000, sd: 0.309359} }
  decision:      { mag: {mean: -0.866434, sd: 0.309359}, dir: {mean: 0.866434, sd: 0.309359} }
  # structure / orientation added here when toggled active

confounders:
  # continuous confounders (stage_size, comp): one weight, applied to the
  # standardized value. stage_size: 7/10 large vs 7/10 small -> no effect.
  # comp: 9/10 above market vs 5/10 below -> 0.549306 per standardized unit.
  stage_size:  { mean: 0.000000, sd: 0.500000 }
  comp:        { mean: 0.549306, sd: 0.500000 }
  # industry is categorical (see solverah_model_config.yaml `levels`) -- this
  # single {mean, sd} is the shared prior for a *vector* of independent
  # per-level weights, not one scalar weight. She answered "yes, it matters"; that
  # keeps the mean neutral and the sd wide, leaving the per-level story to data.
  industry:    { mean: 0.000000, sd: 1.000000 }
  # prestige added here when toggled active

# Ordinal-head cutpoint spacings. NOT expert-elicited -- placeholder priors.
# The cutpoint between ratings 3 and 4 is PINNED at 0 so that sigmoid(z)
# is exactly P(rating >= 4) = "doing well"; see build_model.py.
cutpoints:
  spacing: { mu_log: 0.405465, sigma_log: 0.5 }   # LogNormal; exp(mu) = 1.5
