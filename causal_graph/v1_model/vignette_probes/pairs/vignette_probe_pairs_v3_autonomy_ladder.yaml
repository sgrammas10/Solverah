# UPDATED 2026-08-18: person_item_choices letters remapped for au2v2 and au4v2, whose
# option ORDER (not text) changed in assessment_items_v2_PROPOSED.yaml design rule 2
# (key-position balance). Item wording, target_person values, person_vignette text and
# all cached company-side results are unchanged and remain valid -- company scoring does
# not depend on person-item option order. No API re-run is required for 0.1/0.5/0.7/0.9;
# the 0.3 band still needs its one live call, exactly as before.
#
# vignette_probe_pairs_v3_autonomy_ladder.yaml
#
# Validates the au1v2-au4v2 graduated-difficulty item ladder (autonomy_items_v2_POC.yaml)
# against all 5 company bands, not just the 3 round 1 tested. Person side uses the NEW
# items; company side reuses round 1 and round 2's ALREADY-SCORED vignettes verbatim for
# 4 of 5 levels (company scoring doesn't depend on which person items exist -- no need to
# re-spend API calls on inputs already measured with zero variance). Only the 0.3 level
# is new and needs a live run.
#
# Reused, cached, do NOT re-run:
#   0.1 -> vignette_probe_pairs_v1.yaml, dimensions.autonomy.pairs[level=low]   (scored 0.1, n=5, zero variance)
#   0.5 -> vignette_probe_pairs_v1.yaml, dimensions.autonomy.pairs[level=mid]   (scored 0.5, n=5, zero variance)
#   0.7 -> vignette_probe_pairs_v2_boundary.yaml, autonomy boundary_07 pair     (scored 0.7, n=5, zero variance)
#   0.9 -> vignette_probe_pairs_v1.yaml, dimensions.autonomy.pairs[level=high]  (scored 0.9, n=5, zero variance)
# New, needs a live run:
#   0.3 -> written below, matching anchors.json's "leaning directed" band text (paraphrased)
#
# PREDICTED person scores (hand-scored against au1v2-au4v2, verified offline against
# autonomy_items_v2_POC.yaml before any company-side call -- see score_person_side.py):
#   0.1 -> person 0.0   (endorses none of the 4 items)
#   0.3 -> person 0.25  (endorses only au1v2, the easiest)
#   0.5 -> person 0.5   (endorses au1v2 + au2v2)
#   0.7 -> person 0.75  (endorses au1v2 + au2v2 + au3v2, NOT au4v2)
#   0.9 -> person 1.0   (endorses all four)
# If this pattern holds against company's already-known 0.1/0.5/0.7/0.9 results plus the
# new 0.3 result, every gap should be <=0.1 (the same irreducible floor/ceiling minimum
# round 1 found) instead of round 2's 0.2-0.3 gap at the 0.7 level specifically.
#
# STATUS: this validates design coherence and (for the one new call) company-side precision
# at the 0.3 band. It does NOT validate that real respondents' answers actually follow this
# difficulty ordering -- that needs a real pilot. Flagged, not resolved, by this file.

rubric_version_expected: v1-frozen-2026-08-15

dimensions:

  autonomy:
    items: [au1v2, au2v2, au3v2, au4v2]
    pairs:

    - level: "0.1"
      target_band: 0.1
      target_person: 0.0
      cached_from: "vignette_probe_pairs_v1.yaml (autonomy/low) -- do not re-run"
      person_item_choices: { au1v2: B, au2v2: A, au3v2: B, au4v2: A }
      person_vignette: >
        Even for something routine that I've done plenty of times, I'll usually double
        check the expected approach before diving in, just to be safe. If I'm handed
        something new but pretty low-risk, I'd still rather get my plan looked at before
        I start rather than just wing it based on my own read. Handed a project with a
        tight deadline and no set process, my instinct is to ask how they want it
        structured rather than guess. And honestly, even on the most important work,
        I've never minded getting sign-off on the direction and the plan before starting
        -- what actually frustrates me is being left to figure out something high-stakes
        entirely on my own with nobody around to sanity-check my read of it.
      company_vignette: >
        Every task the team picks up comes from a detailed brief that spells out exactly
        how to execute it, not just what's needed. Before anything ships, it passes
        through two layers of manager review, and the internal wiki has a step-by-step
        playbook for nearly every recurring task. New hires are told during onboarding
        that the fastest way to get in trouble here is to skip a step in the playbook.

    - level: "0.3"
      target_band: 0.3
      target_person: 0.25
      person_item_choices: { au1v2: A, au2v2: A, au3v2: B, au4v2: A }
      person_vignette: >
        For something routine I've done many times, I don't really see the point in
        double-checking the approach -- I'll just go ahead and do it my usual way. That
        said, if it's something new, even if the risk is fairly low, I'd still rather get
        my plan looked at by my manager before starting. Handed a project with a tight
        deadline and no process, I'd rather ask how they want it structured than guess
        wrong. And honestly, even on the most important work, I've never minded checking
        in and getting sign-off on the direction before starting -- what's actually
        frustrated me is being left to figure out something high-stakes completely on my
        own with no one around to sanity-check it.
      company_vignette: >
        Managers set the overall direction and priorities for each project, and people
        have some say in exactly how they execute within that frame, but the frame
        itself isn't up for negotiation. A few day-to-day tactical calls are left to the
        individual, though anything touching the bigger picture goes through a manager
        first.

    - level: "0.5"
      target_band: 0.5
      target_person: 0.5
      cached_from: "vignette_probe_pairs_v1.yaml (autonomy/mid) -- do not re-run"
      person_item_choices: { au1v2: A, au2v2: B, au3v2: B, au4v2: A }
      person_vignette: >
        For something routine, I'll just handle it my usual way without checking in
        first. If I'm handed something new that's fairly low-risk, I'll go ahead and
        figure out my own approach as I go rather than get it reviewed first. That said,
        on a project with a real deadline and no set process, I'd still rather ask how
        they want it structured than guess and get it wrong. And even on the most
        important work, I've never really minded checking in and getting sign-off on the
        plan before starting -- what's frustrated me more is being left completely on my
        own on something high-stakes with no one to sanity-check my read of it, even
        once.
      company_vignette: >
        Team leads set the quarter's priorities and the big milestones, but how each
        person gets there is mostly up to them -- some follow a shared template, others
        don't. A couple of workflows are documented, but plenty of day-to-day calls are
        made without looping anyone in first. It really depends on the person and the
        project; there's no single house style for how independent people are expected
        to be.

    - level: "0.7"
      target_band: 0.7
      target_person: 0.75
      cached_from: "vignette_probe_pairs_v2_boundary.yaml (autonomy boundary_07) -- do not re-run"
      person_item_choices: { au1v2: A, au2v2: B, au3v2: A, au4v2: A }
      person_vignette: >
        For something routine, I'll just handle it my way without checking in. Handed
        something new that's fairly low-risk, I'll figure out my own approach as I go
        rather than wait for a review. And when I'm given a project with a tight deadline
        and no set process, I map out my own approach and run with it, checking in with
        my manager only when I actually need to. That said, even on the most important
        work, I've never really minded getting sign-off on the direction before I start
        -- what's actually frustrated me is being left entirely on my own on something
        high-stakes without anyone available even once to sanity-check my read of the
        situation.
      company_vignette: >
        Each person on the team is responsible for the outcome they're assigned, and
        they largely choose how to get there, though a manager still signs off before
        anything major goes out. Job postings talk about people owning their area and
        being judged on results rather than on following a specific process. A recent
        internal memo mentioned wanting to give people more room to decide how they
        work, without describing it as a finished shift yet.

    - level: "0.9"
      target_band: 0.9
      target_person: 1.0
      cached_from: "vignette_probe_pairs_v1.yaml (autonomy/high) -- do not re-run"
      person_item_choices: { au1v2: A, au2v2: B, au3v2: A, au4v2: B }
      person_vignette: >
        For something routine, I'll just handle it my way without checking in. Handed
        something new that's fairly low-risk, I'll figure out my own approach as I go.
        On a project with a tight deadline and no set process, I map out my own approach
        and run with it, checking in only when I actually need to. And what's frustrated
        me most in past jobs has been that even on the most important work, I was still
        expected to check in and get sign-off on the direction and the plan before
        starting, not just the finer details -- I'd rather be trusted to run with my own
        read on something high-stakes, sign-off or not.
      company_vignette: >
        People here are trusted to own their piece end to end -- nobody's checking in on
        how you get to the result, only that you deliver it. There's no standard
        playbook because the expectation is that everyone builds their own approach as
        they go. A recent internal survey found that most employees couldn't recall the
        last time they needed formal approval to change how they worked.
