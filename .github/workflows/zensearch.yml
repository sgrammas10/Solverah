name: Run ZenSearch Scraper

# ── PAUSED 2026-08-20 (GAP-12, Sebastian's decision) ─────────────────────────
# The scheduled scrape of api.zensearch.jobs ran with a spoofed Referer, i.e.
# outside the source's intended access terms, and committed the results to the
# repo. Both stopped:
#   * schedule trigger removed — the workflow no longer runs on its own;
#   * manual dispatch is also inert until the '@vitalets/google-translate-api'
#     dependency (removed from package.json the same day, also for ToS reasons)
#     is restored, since the scraper imports it.
# To resume: obtain permission from ZenSearch or replace the source (tracked in
# the decision queue), restore the dependency, and re-add the schedule block:
#   schedule:
#     - cron: "0 0 */2 * *"
on:
  workflow_dispatch:        # Manual trigger only — see pause note above

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24


      - name: Install Dependencies
        run: npm install  # Installs required Node.js dependencies

      - name: Run Scraper
        run: node Scripts/zensearch/zensearch.js run  # Runs scraper directly

      # Scraped data is no longer committed to the repo (GAP-07f/GAP-12):
      # results stay in the runner's workspace as a build artifact only.
      - name: Upload results as artifact (not committed)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: zensearch-results
          path: zensearchData/
          retention-days: 14
