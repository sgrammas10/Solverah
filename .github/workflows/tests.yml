name: Run Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend-tests:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # SHA-pinned: version tags are mutable, so `@v4.2.2` can be repointed at
        # different code. persist-credentials:false keeps GITHUB_TOKEN out of
        # .git/config, which matters because later steps execute third-party
        # code (npm lifecycle scripts).
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        # `npm ci` installs the locked tree exactly and fails if package.json
        # and the lock have drifted. `npm install` silently reconciles them,
        # which means the tree CI audits need not be the tree that was reviewed.
        run: npm ci

      - name: Run Tests
        run: npm test -- --run

      # Supply-chain gate (GAP-07d): fail on known-vulnerable prod deps.
      # continue-on-error stays false on purpose — a red audit is a real signal.
      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high

  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # SHA-pinned: version tags are mutable, so `@v4.2.2` can be repointed at
        # different code. persist-credentials:false keeps GITHUB_TOKEN out of
        # .git/config, which matters because later steps execute third-party
        # code (package build hooks during pip install).
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite:///test.db
          JWT_SECRET_KEY: test-secret
          JWT_COOKIE_SECURE: "false"
          JWT_COOKIE_SAMESITE: Lax
        run: pytest --tb=short

      # Supply-chain gate (GAP-07d): known CVEs in installed Python deps.
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit
