name: Run Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend-tests:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # SHA-pinned: version tags are mutable, so `@v4.2.2` can be repointed at
        # different code. persist-credentials:false keeps GITHUB_TOKEN out of
        # .git/config, which matters because later steps execute third-party
        # code (npm lifecycle scripts).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        # `npm ci` installs the locked tree exactly and fails if package.json
        # and the lock have drifted. `npm install` silently reconciles them,
        # which means the tree CI audits need not be the tree that was reviewed.
        run: npm ci

      # Type errors do not fail Vitest: it transpiles per-file and strips types
      # without checking them, so a broken type survives a green suite. `tsc -b`
      # is the only thing in this job that reads tsconfig and checks across
      # files. Placed before the tests so the cheap gate reports first.
      - name: Type Check
        run: npm run type-check

      - name: Run Tests
        run: npm test -- --run

      # Nothing above this line builds. Vitest transpiles per-file through Vite's
      # dev pipeline and never produces a bundle, so until now a production build
      # that failed outright — a bad `lazy()` import path, a plugin that only
      # runs in build mode — reached Vercel with CI green. This step is a gate in
      # its own right, and the budget below needs the artifact anyway.
      - name: Build
        run: npm run build

      # Bundle budget (GAP/ARCHITECTURE.md 6.5). Measures the entry chunk and the
      # stylesheet — what the browser downloads before first paint — and fails on
      # regression. The limits in .size-limit.cjs are ~5 % above the sizes
      # measured at 79969d3, not aspirational targets: a budget the build already
      # exceeds is red on day one and gets raised or deleted rather than heeded.
      #
      # Note for whoever sees this fail: find what landed on the eager path
      # before raising the number. `npm run build` prints per-chunk sizes.
      - name: Bundle budget
        run: npm run size

      # Supply-chain gate (GAP-07d): fail on known-vulnerable prod deps.
      # continue-on-error stays false on purpose — a red audit is a real signal.
      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # THE GATE. Runs against the database the product actually runs on.
  #
  # Until 2026-08-27 the only backend job was SQLite, so 926 passing tests were
  # evidence about a database that exists nowhere in production (P1-9, and
  # decision A8: "tests that pass against a database the product does not run are
  # not evidence"). Moving here failed 8 of them immediately — every one a real
  # orphaned foreign key that SQLite had been silently accepting for months.
  # ---------------------------------------------------------------------------
  backend-tests-postgres:
    name: Backend (pytest · Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Postgres 18, NOT 16 — and the difference is load-bearing, not incidental.
        #
        # Render's managed instance was measured on 2026-08-27 and reports
        # `PostgreSQL 18.3 (Debian 18.3-1.pgdg12+1)`. The Part 4 schema declares
        # `public_id UUID NOT NULL DEFAULT uuidv7()`, and `uuidv7()` is a Postgres
        # 18 built-in that does not exist in 16. A pg16 service container would
        # therefore red-light every Phase 2 migration that production accepts
        # happily — reintroducing exactly the test/prod divergence this job was
        # created to remove, only pointing the other way.
        #
        # Digest-pinned for the same reason the actions above are SHA-pinned: a
        # tag is a mutable pointer. Bumping it is a deliberate edit — re-pull the
        # tag, read the new digest, and let this job prove the suite still passes.
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: solverah
          POSTGRES_PASSWORD: solverah
          POSTGRES_DB: solverah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverah -d solverah"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # The service container starts before the repo is checked out, so it cannot
      # run infra/docker/initdb/01-extensions.sql the way `compose up` does. Same
      # three extensions, applied as a step instead.
      - name: Enable required extensions
        env:
          PGPASSWORD: solverah
        run: |
          psql -h localhost -U solverah -d solverah -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL

      # `flask backups run` shells out to pg_dump, and pg_dump REFUSES a server
      # newer than itself — the runner image ships a client several majors
      # behind this pg18 service container, so without this step every test
      # that takes a real dump skips, and the backup path would be gated by
      # nothing but its own unit tests. (Production does not have the problem:
      # that cron runs on infra/docker/Dockerfile.backup, which pins
      # postgresql-client-18. This step is CI catching up to the image.)
      #
      # Failure here is tolerated on purpose: apt.postgresql.org is a third-party
      # archive and a merge should not depend on it being up. The tests skip
      # with a loud reason when the client is missing, so an outage costs
      # coverage for one run instead of turning the gate red for every commit in
      # the meantime. Watch for those skip lines if backup behaviour ever looks
      # unverified.
      #
      # The tolerance lives inside the script rather than in a step-level
      # failure-tolerance key: the `else` branch names what was lost, in a
      # warning annotation, where the run summary shows it. A step key would
      # mark the step orange and say nothing about what stopped being verified.
      # (test_config.py separately forbids that key at JOB level here — the gate
      # must always be able to fail the build. A step swallowing its own
      # optional dependency is a different thing from a gate that cannot gate.)
      - name: Install PostgreSQL 18 client (for the backup cron's tests)
        run: |
          set -x
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          repo_url=http://apt.postgresql.org/pub/repos/apt
          if sudo install -d "$(dirname "$key")" \
            && curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee "$key" > /dev/null \
            && echo "deb [signed-by=$key] $repo_url $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null \
            && sudo apt-get update \
            && sudo apt-get install -y postgresql-client-18
          then
            pg_dump --version
          else
            echo "::warning::PostgreSQL 18 client unavailable; the backup cron's dump/verify/prune tests will SKIP this run."
          fi

      - name: Run Tests
        # Exactly five variables, and no .env on the runner. Anything reading a
        # sixth fails here and passes on a developer machine, because app.py calls
        # load_dotenv(). That asymmetry is the point — see CLAUDE.md.
        #
        # Note there is still no BACKUP_S3_* here: the backup tests prove the
        # dump, the verification and the prune for real, and mock only the object
        # store. A test that uploaded to a real bucket would also prune one.
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql://solverah:solverah@localhost:5432/solverah
          JWT_SECRET_KEY: test-jwt-secret-not-a-real-one-32-bytes-min
          JWT_COOKIE_SECURE: "false"
          JWT_COOKIE_SAMESITE: Lax
        run: pytest --tb=short

      # Supply-chain gate (GAP-07d): known CVEs in installed Python deps.
      # Lives on the gating job so it runs exactly once per commit.
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit

  # ---------------------------------------------------------------------------
  # THE OTHER GATE. Runs the migration chain production actually runs.
  #
  # The pytest job above never executes a migration: its fixtures build schema
  # with db.create_all(), so a green suite proves the *models* work and says
  # nothing about the *chain*. Production runs `flask db upgrade` as Render's
  # Pre-Deploy Command on every deploy — until this job, that command shipped
  # unexecuted by CI (2026-09 audit, gap 5). tests/test_migrations_chain.py
  # guards the chain's structure (revision-id length, single head, linkage)
  # without touching a database; this job is the execution half: an EMPTY pg18
  # database taken to head, exactly as a deploy would.
  #
  # Postgres 18 for the same load-bearing reason as the job above (prod is
  # 18.3, uuidv7() is a native built-in the migrations use) — same digest, keep
  # the two in lockstep, and never downgrade the container to make a migration
  # pass. `flask db check` (autogenerate drift) is deliberately NOT run here:
  # as of 2026-09-03 it false-positives on the partition child tables
  # (rec_action_2026_*, audit_log_*, match_recommendation_*), which exist in
  # the database but not in the models; making it clean needs include_object
  # filtering in migrations/env.py first.
  # ---------------------------------------------------------------------------
  backend-migrations-postgres:
    name: Backend (flask db upgrade · Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: solverah
          POSTGRES_PASSWORD: solverah
          POSTGRES_DB: solverah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverah -d solverah"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Same three extensions as the pytest job, same reason: the service
      # container starts before checkout, so infra/docker/initdb cannot run.
      # Render's managed Postgres has these pre-installed; a deploy's upgrade
      # never creates them, so neither does the chain — they are precondition,
      # not migration output.
      - name: Enable required extensions
        env:
          PGPASSWORD: solverah
        run: |
          psql -h localhost -U solverah -d solverah -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL

      # DATABASE_URL + JWT_SECRET_KEY (same test value as the pytest job).
      # JWT_SECRET_KEY is unconditionally required by config.py in EVERY
      # environment. The original "DATABASE_URL alone suffices" local
      # verification passed only because the developer machine supplies the
      # variable invisibly (a machine-wide env var there; .env via the Flask
      # CLI's own dotenv load is a second route) — the runner has neither, and
      # the first live run failed on it (2026-09-03). An honest local repro
      # needs FLASK_SKIP_DOTENV=1 AND explicitly clearing JWT_SECRET_KEY.
      - name: Upgrade from empty database
        env:
          DATABASE_URL: postgresql://solverah:solverah@localhost:5432/solverah
          JWT_SECRET_KEY: test-jwt-secret-not-a-real-one-32-bytes-min
        run: flask db upgrade

      # Belt for the silent-no-op failure mode: if env.py ever stopped seeing
      # DATABASE_URL (see its own 2026-08-19 war story), upgrade could "pass"
      # against the wrong target. Prove the service container itself now sits
      # at the single head the repo declares.
      - name: Assert database is at the chain head
        env:
          DATABASE_URL: postgresql://solverah:solverah@localhost:5432/solverah
          JWT_SECRET_KEY: test-jwt-secret-not-a-real-one-32-bytes-min
          PGPASSWORD: solverah
        run: |
          # The app's own INFO log lines share stdout with the revision list,
          # so match the "<revision> (head)" line rather than trusting line 1.
          head=$(flask db heads | awk '/\(head\)/ {print $1; exit}')
          current=$(psql -h localhost -U solverah -d solverah -tAc \
            "SELECT version_num FROM alembic_version")
          echo "repo head: $head"
          echo "database:  $current"
          test -n "$head" && test "$head" = "$current"

  # ---------------------------------------------------------------------------
  # RETIRED 2026-08-27 (Phase 2a). There was a `backend-tests-sqlite` job here.
  #
  # It was never a gate — `continue-on-error: true` — and the only argument for
  # keeping it was written in its own comment: a fast job that is *laxer* than
  # the gate is worse than no fast job at all, because it reports green on
  # precisely the defects the gate exists to catch. `conftest.py` setting
  # `PRAGMA foreign_keys=ON` was what kept that argument true.
  #
  # Phase 2a ends it. The Part 4.3 profile tables use five things SQLite cannot
  # express — `DEFAULT uuidv7()`, identity columns, JSONB, `TEXT[]`, and a GIN
  # trigram index — and the fixtures build the schema with `db.create_all()`, so
  # the job could not reach a single test, let alone run one laxly.
  #
  # The three ways out, and why this one:
  #
  #   * Make the defaults application-side for portability. This is the one that
  #     looks reasonable and is not. `docs/ARCHITECTURE.md` Phase 2 settled it on
  #     a measurement of the real database — "uuidv7() is a native built-in here
  #     and works... no table in Part 4 needs app-side ULID or UUIDv7
  #     generation" — and `tests/test_database_parity.py` exists specifically to
  #     stop that being reversed for a CI container's benefit. It would also be
  #     a permanent change to every table in Part 4, bought to satisfy a database
  #     the product does not run on.
  #
  #   * Skip the new tables on SQLite. That leaves the fast job blind to the only
  #     thing that changed, which is the laxness the paragraph above rules out.
  #
  #   * Retire it. Postgres is the gate, and the gate now runs the schema
  #     production runs.
  #
  # Worth saying plainly: retiring is also the option that most easily keeps CI
  # green, which is a reason to distrust it. It survives that anyway. Phase 2
  # item 4 (pgvector + HNSW, struck by A16) and item 5 (declarative
  # partitioning) are not expressible on SQLite under any of the three
  # options, so portability bought here is spent inside the same phase — and
  # A8 is that tests passing against a database the product does not run are
  # not evidence.
  #
  # What is lost is real: the Postgres job takes ~3 minutes where SQLite took
  # under one, so ordinary breakage now surfaces later. The replacement is a
  # faster gate, not a laxer second opinion.
  # ---------------------------------------------------------------------------
