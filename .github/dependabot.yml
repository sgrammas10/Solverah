# Dependabot — automated dependency-update PRs (GAP-07d, added 2026-08-20).
# Weekly cadence, grouped minor/patch bumps to keep PR noise low; security
# updates arrive regardless of schedule.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # numpy 2.5 dropped Python 3.11 (Requires-Python >=3.12), which CI and
      # the Dockerfile still run; Dependabot doesn't read that metadata and
      # proposed an uninstallable pin (#131). Lift when the runtime is 3.12+.
      - dependency-name: "numpy"
        versions: [">=2.5.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
