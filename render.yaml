# Render Blueprint — Solverah production topology.
#
# ⚠️  THIS FILE GOVERNS NOTHING TODAY. Render only applies render.yaml through
# a Blueprint instance, and production's web service + database were created
# by hand in the dashboard, which no Blueprint manages. Merging this file
# changes no infrastructure. It exists to make production reviewable in the
# repo (the 1-worker-gunicorn surprise of 2026-09-02 is what dashboard-only
# config costs) and to be ready if a Blueprint is ever adopted. The two
# adoption paths and their risks: docs/RENDER_DEPLOYMENT.md.
#
# Source of truth for what is written here: the 2026-09-02 dashboard intake
# (docs/audits/PROD_READINESS_2026-09_ANSWERS.md). Env vars are listed as
# KEYS ONLY (sync: false) — values live in Render, never in this repo.
#
# Not captured in the intake, so deliberately omitted (Render would apply its
# defaults on Blueprint adoption — fill these from the dashboard first):
#   - `plan` for the web service and the database
#   - `region`
#   - a pinned Python version (native runtime; prod runs Render's default —
#     CI uses 3.11; pin via PYTHON_VERSION when adopting)

services:
  # ---------------------------------------------------------------- web (API)
  # Exists today, dashboard-created. Native Python runtime, NOT
  # infra/docker/Dockerfile.api. Bare `gunicorn app:app` auto-loads the
  # repo-root gunicorn.conf.py from the working directory (gthread, threads=8;
  # `workers` comes from that file, not from here).
  #
  # The Pre-Deploy Command is the load-bearing line: `flask db upgrade` runs
  # once per deploy, before instances swap — a failed migration fails the
  # deploy and the old version keeps serving. CI executes the same chain
  # against pg18 (job `migrations-postgres` in .github/workflows/tests.yml).
  - type: web
    name: solverah-api
    runtime: python
    branch: main
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask db upgrade
    startCommand: gunicorn app:app
    autoDeployTrigger: commit   # dashboard: auto-deploy on push to main
    domains:
      - api.solverah.com        # live; frontend at solverah.com is Vercel, not Render
    envVars:
      - fromGroup: solverah-prod
      - key: DATABASE_URL
        fromDatabase:
          name: solverah-db
          property: connectionString

  # ------------------------------------------------------------ cron: outbox
  # Does NOT exist in the dashboard yet. The command names are a contract with
  # the round that is building the CLI (`flask outbox sweep`): drains/retries
  # unpublished outbox rows, the job that eager mode (no Redis, no worker)
  # otherwise never runs — a row that fails its single inline send attempt is
  # parked forever without this.
  - type: cron
    name: solverah-outbox-sweep
    runtime: python
    branch: main
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: flask outbox sweep
    envVars:
      - fromGroup: solverah-prod
      - key: DATABASE_URL
        fromDatabase:
          name: solverah-db
          property: connectionString

  # --------------------------------------------------------- cron: retention
  # Does NOT exist in the dashboard yet. `flask retention run` is the same
  # contract: retention/purge work (delivered outbox rows hold email addresses
  # and one-time codes — the PII-retention hole in the 2026-09 audit, gap 1).
  # 04:30 UTC is arbitrary off-peak; any daily time works.
  - type: cron
    name: solverah-retention
    runtime: python
    branch: main
    schedule: "30 4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: flask retention run
    envVars:
      - fromGroup: solverah-prod
      - key: DATABASE_URL
        fromDatabase:
          name: solverah-db
          property: connectionString

  # ----------------------------------------------------------- cron: backups
  # Does NOT exist in the dashboard yet. `flask backups run` dumps the database
  # (-Fc), verifies the artifact with `pg_restore --list` BEFORE uploading it,
  # uploads to the backup bucket, and prunes artifacts older than 30 days —
  # never the newest, and never at all if fewer than 7 would remain. Before
  # this, the whole backup posture was Render's 7-day PITR plus one manually
  # rehearsed dump (PROD_READINESS_2026-09.md §6): nothing scheduled, and
  # nothing stored anywhere a compromise of this Render account would not also
  # reach. That second half is why the credentials below are their own.
  #
  # `runtime: docker`, unlike the two crons above and unlike the web service.
  # This is the only service here that shells out to pg_dump, the client major
  # must be >= the server's 18.3, and Render's native Python runtime guarantees
  # no PostgreSQL client at all. infra/docker/Dockerfile.backup pins
  # postgresql-client-18 and fails its own build if that ever stops being true.
  #
  # 03:30 UTC: an hour before the retention purge at 04:30, so a backup taken
  # tonight still contains the rows tonight's purge is about to delete.
  - type: cron
    runtime: docker
    name: solverah-backups
    branch: main
    schedule: "30 3 * * *"
    dockerfilePath: ./infra/docker/Dockerfile.backup
    dockerContext: .
    startCommand: flask backups run
    envVars:
      - fromGroup: solverah-prod
      - fromGroup: solverah-backups
      - key: DATABASE_URL
        fromDatabase:
          name: solverah-db
          property: connectionString

  # ----------------------------------------------------- cron: corpus refresh
  # Does NOT exist in the dashboard yet, and unlike the three above it is NOT
  # urgent: the artifact only goes stale as fast as O*NET publishes, which is
  # quarterly. `flask corpus refresh` is build -> zones -> clusters -> publish,
  # ~3,084 O*NET requests at the shared 4/s ceiling (~13 minutes, 6% of the
  # 50,000/day cap) and ~$0.01 of embeddings. `--dry-run` reports the plan and
  # makes no network call of any kind, which is how to check this box's
  # configuration without spending any of that.
  #
  # ⚠ THIS CRON DOES NOT DEPLOY A CORPUS, AND THAT IS THE DESIGN. It uploads a
  # NEW date-stamped key and leaves the one in service untouched; production
  # keeps serving whatever SOLVERAH_CORPUS_S3_KEY names until a human changes
  # it. A published version is immutable — workers cache it and never re-fetch,
  # so a refresh that silently replaced the artifact underneath them would put
  # half the fleet on one corpus and half on another. The promotion is a
  # separate, reviewable act, and it is also the rollback.
  #
  # So the operator loop is: the cron produces a candidate every quarter, and
  # somebody looks at it (`flask corpus clusters --show` is the cheapest look)
  # before pointing the key at it. If nobody ever does, production keeps
  # serving a known-good corpus, which is the right failure mode.
  #
  # SOLVERAH_CORPUS_DIR is the cron box's own scratch space, not the web
  # service's cache — the artifact is built there, uploaded, and thrown away
  # with the container.
  #
  # 05:00 UTC on the 1st of Jan/Apr/Jul/Oct: off-peak, and clear of the daily
  # crons above rather than sharing a minute with them.
  - type: cron
    name: solverah-corpus-refresh
    runtime: python
    branch: main
    schedule: "0 5 1 1,4,7,10 *"
    buildCommand: pip install -r requirements.txt
    startCommand: flask corpus refresh
    envVars:
      - fromGroup: solverah-prod
      - key: SOLVERAH_CORPUS_DIR
        value: /tmp/solverah-corpus-build
      # Not DATABASE_URL: this command reads O*NET, OpenAI and S3 and touches
      # no table. `create_app()` still runs, so the app's own config validation
      # applies, but nothing here queries.

# ------------------------------------------------------------------ database
# Exists today, dashboard-created. Measured 2026-08-27 as PostgreSQL 18.3 —
# uuidv7() is a native built-in the schema depends on (DEFAULT uuidv7()), so
# 18 is load-bearing; never downgrade this to make anything pass. PITR window
# 7 days (re-confirmed 2026-09-02). Scheduled logical backups are the
# solverah-backups cron above — off-platform storage and a 30-day window, which
# is what PITR alone (7 days, same account, same vendor) does not give.
databases:
  - name: solverah-db
    postgresMajorVersion: "18"

# ---------------------------------------------------------------- env groups
# The dashboard currently sets these directly on the web service, not in a
# group. A group is used here so the web service and the cron jobs share one
# set — on Blueprint adoption Render prompts for every sync: false value. The
# backup credentials are a second group precisely so they are NOT shared.
#
# Present in the dashboard but NOT codified:
#   - CONFIRM_TOKEN_EXP_HOURS, FRONTEND_URL, JWT_COOKIE_DOMAIN — read by no
#     code on either branch (intake Q5); inert. Delete from the dashboard or
#     wire them up rather than carrying dead config forward.
#   - `S3_Region` (sic) — a casing typo the 2026-09-02 intake found (the code
#     reads `S3_REGION`, storage.py, so the value was ignored and the region
#     fell back to "auto"). FIXED in the dashboard 2026-09-03; recorded here
#     because the intake snapshot this file transcribes predates the fix.
envVarGroups:
  - name: solverah-prod
    envVars:
      - key: APP_ENV
        value: production       # confirmed value; gates every prod-only config rule
      - key: JWT_SECRET_KEY
        sync: false             # fatal at boot if missing or <32 chars in prod
      - key: JWT_COOKIE_SECURE
        sync: false             # prod requires effective true; explicit false is fatal
      - key: JWT_COOKIE_SAMESITE
        sync: false             # cross-subdomain auth (solverah.com ↔ api.solverah.com)
      - key: SOLVERAH_FORM_TOKEN_SECRET
        sync: false             # no default by design (D-05); read at call time —
                                # missing = every assessment route 500s, boot stays green
      # ⚠ DEPLOY DEPENDENCY (Workstream F, 2026-09-16). NOT SET IN PRODUCTION
      # TODAY, and Path Intelligence does not work without it. F-4 replaced the
      # old O*NET job-family funnel with retrieval over a precomputed corpus and
      # TOMBSTONED the funnel (`path_scoring.TestTombstones`), so there is no
      # fallback path to degrade to. With no artifact in S3 and no key set:
      #   - POST /me/path-fit            → 503 corpus_unavailable (typed)
      #   - POST/DELETE /me/path-feedback → 503 corpus_unavailable (typed)
      #   - the path-suggestions job      → 500 "Unable to score career paths"
      #     (intelligence_service has no CorpusUnavailable branch on that path —
      #     it falls into the generic handler. Recorded, not fixed, in F-8.)
      #
      # ORDER ON DEPLOY DAY, and it is the order that matters:
      #   1. `flask corpus publish` — uploads the four objects (.npy, .json,
      #      .zones.json, .clusters.json) to S3_BUCKET_NAME. The FIRST REAL
      #      UPLOAD IS SEBASTIAN'S TRIGGER, by his own instruction: F-1 stopped
      #      at local files so a corpus is reviewed before it goes anywhere.
      #   2. set SOLVERAH_CORPUS_S3_KEY to the `corpus_s3_key` that command
      #      echoes — this is what puts an artifact INTO service, and pointing
      #      it back at the previous key is the rollback.
      #   3. verify one worker loads it (the `occupation corpus loaded:` log
      #      line, which reports row count, dims and whether zones came down)
      #   4. THEN merge.
      # A deploy in any other order serves errors on every path route until
      # step 2, and nothing fails at boot to tell you — `get_corpus()` is lazy
      # and per-worker by design, so the first symptom is a user's 503.
      - key: SOLVERAH_CORPUS_S3_KEY
        sync: false             # e.g. occupation_retrieval/onet_corpus_20260916.npy
                                # the three sidecar keys are DERIVED from this one
      - key: SOLVERAH_CORPUS_CACHE_DIR
        sync: false             # where a worker caches the 6 MB artifact after its
                                # first fetch; defaults to <tmp>/solverah-corpus-cache,
                                # which is correct on Render's ephemeral disk. Set it
                                # only to move the cache off /tmp.
      # ⚠ DEPLOY DEPENDENCY (S1, 2026-09-03). NOT SET IN PRODUCTION TODAY, and
      # as of S1 the app will not boot in production without it: `memory://`
      # rate-limit storage raises ConfigError instead of warning, because
      # per-worker counters make every limit in the application decorative
      # (2026-09 audit 9.1, its highest-impact finding). Provision a Render
      # Key-Value instance and set this BEFORE merging S1 to main — a deploy in
      # the other order fails at boot, not at first request.
      #
      # One variable, three consumers: the rate limiter (fatal, above), the
      # Celery broker/result backend (warns), and the read cache (silent).
      # RATELIMIT_STORAGE_URI / CELERY_BROKER_URL split them if they ever need
      # separate instances.
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ONET_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false             # casing typo fixed 2026-09-03 — see note above
      - key: SENTRY_DSN
        sync: false             # optional: error tracking is disabled when unset
                                # (added 6b8584d; not yet in the 2026-09-02 intake list)

  # A SECOND group, attached only to solverah-backups — and the separation is
  # the point, not tidiness. These credentials must belong to an identity that
  # can write the backup bucket and that the web service cannot use, so that a
  # stolen application key cannot read or delete the backups. `solverah/config.py`
  # validates the group all-or-nothing at boot and REFUSES if either the bucket
  # or the access key id matches the app's S3_* values; there is no fallback to
  # them anywhere in the code. Do not add this group to the web service.
  - name: solverah-backups
    envVars:
      - key: BACKUP_S3_ENDPOINT_URL
        sync: false
      - key: BACKUP_S3_BUCKET_NAME
        sync: false             # a DIFFERENT bucket from S3_BUCKET_NAME
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false             # a DIFFERENT token from S3_ACCESS_KEY_ID
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
